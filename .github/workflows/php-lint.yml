name: PHP Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP syntax and security regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.php' -not -path './.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            php -l "$file"
          done
      - name: Run source-level security checks
        run: php tests/security_checks.php
      - name: Run HTTP security smoke tests
        run: bash tests/http_security_smoke.sh
      - name: Run Docker and MySQL integration smoke test
        run: bash tests/docker_integration_smoke.sh
