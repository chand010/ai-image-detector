name: PHP Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    name: Check PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.php' -not -path './.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            php -l "$file"
          done
